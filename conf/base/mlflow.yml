server:
  mlflow_tracking_uri: "http://127.0.0.1:5000"
  mlflow_registry_uri: "http://127.0.0.1:5000"
  credentials: null
  request_header_provider:
    type: null
    pass_context: False
    init_kwargs: {}

tracking:
  disable_tracking:
    disable_autologging: True
    pipelines: []

  experiment:
    name: "sp500_direction_prediction"
    create_experiment_kwargs:
      artifact_location: null
      tags: null
    restore_if_deleted: True

  run:
    id: null
    name: null
    nested: True

  params:
    dict_params:
      flatten: False
      recursive: True
      sep: "."
    long_params_strategy: fail

ui:
  port: "5000"
  host: "127.0.0.1"
